[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "lather-lens-harness"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.1",
  "sqlalchemy==2.1.6",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.6",
  "uvicorn==0.54.0",
  "httpx==0.28.1",
  "tldextract==5.3.0",
  "langgraph==1.2.12",
  "langsmith==0.14.12",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.17.2", "mypy==2.4.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["integration: explicit local Supabase/Postgres tests (loopback only)"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
files = ["app"]
check_untyped_defs = true
warn_unused_ignores = true
